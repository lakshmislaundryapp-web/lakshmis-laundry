/* Layout: single phone-width column; sticky title bar, scrolling body, sticky action bar. Laundry-tag motifs for order numbers. */
:root{

/* Single light theme by choice: white workspace, navy headings. */

.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;min-height:56px;padding-block:6px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}

/* ---------- Excel import ---------- */
let xlsxP = null;
function loadXLSX(){ if (window.XLSX) return Promise.resolve(window.XLSX); return xlsxP ||= new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; sc.onload = () => res(window.XLSX); sc.onerror = () => { xlsxP = null; rej(new Error("load")); }; document.head.appendChild(sc); }); }
const normUom = v => { const t = String(v ?? "").trim().toLowerCase().replace(/\./g, ""); if (!t) return ""; if (/^(pc|pcs|piece|pieces|no|nos|unit|units)$/.test(t)) return "Piece"; if (/^pairs?$/.test(t)) return "Pair"; if (/^sets?$/.test(t)) return "Set"; if (/^(kg|kgs|kilo|kilogram|kilograms)$/.test(t)) return "Kg"; if (/^(sqft|sq ft|square feet)$/.test(t)) return "Sq.ft"; return ""; };
function buildPlan(rows){
  const P_RE = /^(product|product name|item|item name|garment|particulars)$/i;
  const hi = rows.findIndex(r => r.some(c => P_RE.test(String(c).trim()))); if (hi < 0) return {error: "No 'Product' column was found in the first sheet. Use the template, or name the first column Product."};
  const head = rows[hi].map(c => String(c ?? "").trim()); const ci = re => head.findIndex(h => re.test(h));
  const cP = ci(P_RE), cG = ci(/^(group|product group|category)$/i), cU = ci(/^(uom|unit|units|unit of measurement)$/i);
  const svcCols = []; head.forEach((h, i) => { if (!h || i === cP || i === cG || i === cU || /^(s\.?\s*no\.?|sl\.?\s*no\.?|sr\.?\s*no\.?|#|description|remarks|notes)$/i.test(h)) return;
    const m = S.d.services.find(sv => sv.name.toLowerCase() === h.toLowerCase() || (sv.code || "").toLowerCase() === h.toLowerCase()); svcCols.push({i, name: h, svcId: m ? m.id : null}); });
  if (!svcCols.length) return {error: "No service columns were found. Add one column per service (for example Ironing, Dry Cleaning) with prices."};
  const lines = [], errors = [], newGroups = new Set(), seen = new Map(); let nNew = 0, nUpd = 0, nPrices = 0;
  rows.slice(hi + 1).forEach((r, k) => {
    const rowNo = hi + 2 + k; const name = String(r[cP] ?? "").trim(); if (!name && r.every(c => String(c ?? "").trim() === "")) return;
    if (!name) { errors.push("Row " + rowNo + ": product name is missing – row skipped"); return; }
    const gname = cG >= 0 ? String(r[cG] ?? "").trim() : ""; const uom = cU >= 0 ? normUom(r[cU]) : "";
    if (cU >= 0 && String(r[cU] ?? "").trim() && !uom) errors.push("Row " + rowNo + ": unknown UOM '" + String(r[cU]).trim() + "' – Piece used");
    if (gname && !S.d.groups.some(g => g.name.toLowerCase() === gname.toLowerCase())) newGroups.add(gname);
    const key = (name + "|" + gname).toLowerCase(); if (seen.has(key)) { errors.push("Row " + rowNo + ": duplicate of row " + seen.get(key) + " (" + name + ") – row skipped"); return; } seen.set(key, rowNo);
    const prod = S.d.products.find(pp => pp.name.toLowerCase() === name.toLowerCase() && (!gname || ((find("groups", pp.group) || {}).name || "").toLowerCase() === gname.toLowerCase()));
    const prices = {}; const bad = [];
    svcCols.forEach(c => { const raw = r[c.i]; if (raw === "" || raw == null) return; const v = typeof raw === "number" ? raw : parseFloat(String(raw).replace(/[₹,\s]|rs\.?/gi, "")); if (!isFinite(v) || v < 0) { bad.push(c.name); return; } prices[c.name] = r2(v); nPrices++; });
    if (bad.length) errors.push("Row " + rowNo + ": invalid price under " + bad.join(", ") + " – that price skipped");
    prod ? nUpd++ : nNew++;
    lines.push({rowNo, name, gname, uom, prod: prod ? prod.id : null, prices});
  });
  if (!lines.length) return {error: "No product rows were found below the header row."};
  return {svcCols: svcCols.map(c => ({name: c.name, svcId: c.svcId})), newSvcs: svcCols.filter(c => !c.svcId).map(c => c.name), newGroups: [...newGroups], lines, nNew, nUpd, nPrices, errors, needOthers: lines.some(l => !l.prod && !l.gname)};
}

    foot: P && !I.done ? '<button class="btn" data-act="runImport"' + (I.busy ? " disabled" : "") + '>' + (I.busy ? esc(I.busy) : "Import " + P.lines.length + " products to " + esc(pl.name)) + '</button>' : "",

async function runImport(){
  const I = S.imp, P = I.plan, plId = I.pl; let n = 0;
  const gmap = {}; S.d.groups.forEach(g => gmap[g.name.toLowerCase()] = g.id); let gs = S.d.groups.length;
  for (const gn of P.newGroups) { if (gmap[gn.toLowerCase()]) continue; const id = newId(); await save("groups", {id, name: gn, sort: ++gs}); gmap[gn.toLowerCase()] = id; }
  if (P.needOthers && !gmap["others"]) { const id = newId(); await save("groups", {id, name: "Others", sort: ++gs}); gmap["others"] = id; }
  const smap = {}; P.svcCols.forEach(c => { if (c.svcId) smap[c.name] = c.svcId; }); let ss = S.d.services.length;
  for (const sn of P.newSvcs) { const id = newId(); const code = (sn.split(/[\s&/-]+/).filter(Boolean).map(w => w[0]).join("") || sn).toUpperCase().slice(0, 3); await save("services", {id, name: sn, code, deliveryDays: "", expressDays: "", gst: true, tagRequired: true, active: true, sort: ++ss}); smap[sn] = id; }
  for (const L of P.lines) {
    const base = L.prod ? clone(find("products", L.prod)) : {id: newId(), name: L.name, group: gmap[(L.gname || "others").toLowerCase()], uom: L.uom || "Piece", sort: L.rowNo, prices: {}};
    if (L.prod && L.uom) base.uom = L.uom;
    base.prices = base.prices || {}; base.prices[plId] = base.prices[plId] || {};
    Object.entries(L.prices).forEach(([sn, v]) => { if (smap[sn]) base.prices[plId][smap[sn]] = v; });
    await save("products", base); n++;
    if (n % 5 === 0) { I.busy = "Importing… " + n + " of " + P.lines.length; const b = document.querySelector('[data-act="runImport"]'); if (b) b.textContent = I.busy; }
  }
  return n;
}
async function dlTemplate(){

function dateStrip(kind, val, rec, slots){ /* tap-to-pick dates; works in every app view, unlike the native date picker */

function effPl(d){ const c = find("customers", d.custId); return custPl(c) || storePl() || null; }

  activeServices().forEach(s => {
    const sd = d.svc[s.id]; if (!sd) return;
    Object.entries(sd.items || {}).forEach(([pid, it]) => {
      const p = find("products", pid); if (!p || !(+it.qty > 0)) return;
      const keep = d.rates && d.rates[s.id + "|" + pid]; const rate = keep !== undefined ? keep : priceOf(p, s.id, effPl(d)); const kg = p.uom === "Kg";
      out.push({ svc: s.id, svcName: s.name, svcCode: s.code || s.name.slice(0, 2).toUpperCase(), prod: pid, name: p.name, uom: p.uom || "Piece", qty: +it.qty, pcs: kg ? (+it.pcs || 0) : +it.qty, rate, amt: r2(rate * +it.qty), speed: sd.speed || "standard", color: it.color || "" });

function calcTotals(d, st){
  const lines = draftLines(d); const exPct = +st.expressPct || 0; const gstOn = !!(st.gstin && String(st.gstin).trim()); const rate = +st.gstRate || 0;
  const bySvc = {}; lines.forEach(l => { (bySvc[l.svc] ||= {name: l.svcName, sub: 0, lines: [], speed: l.speed}); bySvc[l.svc].sub = r2(bySvc[l.svc].sub + l.amt); bySvc[l.svc].lines.push(l); });

  if (d.pickupOverride !== undefined) pickup = d.pickupOverride;

    const km = (c.lat && st.lat) ? roadKm(st, c) : (+c.distanceKm || 0);
    const row = (st.charges || []).find(r => r.amount !== "" && km >= (+r.from || 0) && (r.to === "" || r.to === undefined || km <= +r.to));
    if (row && !(row.billValue !== "" && row.billValue !== undefined && +row.billValue > 0 && sub + express >= +row.billValue)) pickup = +row.amount || 0;

  const base = d.type === "pickup" ? d.pickupDate : todayStr();
  return { lines, bySvc, sub: r2(sub), express: r2(express), pickup, gstOn, gstRate: rate, gst, roundOff, total, pieces, autoDelivery: addDays(base, days) };
}

/* tags */
function buildTags(o){
  const tagged = o.lines.filter(l => { const s = find("services", l.svc); return s ? s.tagRequired !== false : l.tag !== false; });
  const total = tagged.reduce((a, l) => a + (l.pcs || 0), 0); const tags = []; let k = 0;
  const bySvc = {}; tagged.forEach(l => { (bySvc[l.svc] ||= []).push(l); });
  Object.values(bySvc).forEach(ls => {
    const n = ls.reduce((a, l) => a + (l.pcs || 0), 0); let i = 0;
    ls.forEach(l => { const li = o.lines.indexOf(l); for (let j = 0; j < (l.pcs || 0); j++) { i++; k++; tags.push({gid: li + "." + (j + 1), overall: total + "-" + k, svcNo: n + "-" + i, code: l.svcCode, svc: l.svc, product: l.name, color: l.color}); } });
  });
  return tags;
}

function tagInner(o, t, st, forPrint){

  if (tf.orderId !== false) parts.push('<div' + (forPrint ? ' style="font-size:11pt"' : ' style="font-size:13px"') + '><b>' + esc(o.no) + '</b> · ' + esc(fmtDate(o.date)) + '</div>');

const cashRows = x => x && x.tendered ? '<tr><td>Cash given</td><td class="r">' + r2(x.tendered).toFixed(2) + '</td></tr><tr><td>Change returned</td><td class="r">' + r2(x.change).toFixed(2) + '</td></tr>' : "";
function cashMsg(amt, given){ amt = r2(+amt || 0); if (given === "" || given === undefined || given === null || isNaN(+given)) return ['nil', 'Enter the cash given by the customer to see the change']; given = r2(+given);

function wireCash(id, getAmt, setGiven){ const i = document.getElementById(id); if (!i) return; const upd = () => { setGiven(i.value); const o = document.getElementById(id + "out"); const [c, m] = cashMsg(getAmt(), i.value); o.className = "cashout " + c; o.innerHTML = m; }; i.oninput = upd; return upd; }

function loadLogo(file){
  if (!file) { toast("No image was received. Try choosing the logo again."); return; }
  if (/heic|heif/i.test(file.type + file.name)) { toast("HEIC photos can't be read here. Save the logo as JPG or PNG and try again."); return; }
  toast("Reading logo…"); const fr = new FileReader();
  fr.onerror = () => toast("Couldn't read this file. Use a JPG or PNG image.");
  fr.onload = () => { const img = new Image();
    img.onerror = () => toast("This image format isn't supported. Use a JPG or PNG image.");
    img.onload = () => { try { const c = document.createElement("canvas"); const s = 240; const k = Math.min(s / img.width, s / img.height, 1); c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k)); const g = c.getContext("2d"); g.drawImage(img, 0, 0, c.width, c.height); S.form.logo = c.toDataURL("image/png");
      const w = document.createElement("canvas"); const kw = Math.min(600 / img.width, 1); w.width = Math.max(1, Math.round(img.width * kw)); w.height = Math.max(1, Math.round(img.height * kw)); w.getContext("2d").drawImage(img, 0, 0, w.width, w.height);
      S.form.logoWide = img.width > img.height * 1.4 ? w.toDataURL("image/png") : ""; S.form._logoNew = true; render(); toast("Logo added. Tap Save & continue to keep it."); } catch(e){ toast("Couldn't process this image. Try a different JPG or PNG."); } };
    img.src = fr.result; };
  fr.readAsDataURL(file);
}
async function nextNo(st, kind){
  const v = (st.vouchers || {})[kind] || ({pickup: {prefix: (st.code || "") + "-PK-", start: 1}, challan: {prefix: (st.code || "") + "-CH-", start: 1}, complaint: {prefix: (st.code || "") + "-CMP-", start: 1}, trip: {prefix: (st.code || "") + "-TR-", start: 1}}[kind]) || {}; const start = parseInt(v.start) || 1; const fmt = n => (v.prefix || "") + n + (v.suffix || "");
  if (!S.db) { const key = st.id + "_" + kind; S.counters[key] = (S.counters[key] ?? start - 1) + 1; return fmt(S.counters[key]); }
  const ref = S.db.doc("counters/" + st.id + "_" + kind);
  if (S.fire) { const n = await S.db.runTransaction(async tx => { const s0 = await tx.get(ref); const body = s0.exists ? s0.data() : {}; const cur = typeof body.last === "number" && body.start === start ? body.last : start - 1; tx.set(ref, {last: cur + 1, start}); return cur + 1; }); return fmt(n); }
  for (let i = 0; i < 8; i++) {
    const l = await ref.acquire({holder: TAB_ID, ttlMs: 8000});
    if (l.acquired) { const s = await ref.get(); const body = s.exists ? s.data() : {}; const cur = typeof body.last === "number" && body.start === start ? body.last : start - 1; const n = cur + 1; await ref.set({last: n, start}); return fmt(n); }
    await sleep(300 + Math.random() * 500);
  }
  throw new Error("busy");
}

  editOrder: el => { const o = find("orders", el.dataset.id); if (!o || !canEdit(o)) return toast("Prices can't be changed after delivery or payment."); S.form = null; go("editOrder:" + o.id); },
  saveOEdit: async el => {
    const o = find("orders", el.dataset.id); const rec = clone(o); let changed = false;
    rec.lines.forEach((l, i) => { const v = S.form.rates[i]; if (v !== undefined && v !== "" && +v !== l.rate) { if (+v < 0) return; l.rate = +v; changed = true; } });
    if (!changed) return toast("No price changes to save.");
    recompute(rec); rec.edits = [...(o.edits || []), {at: new Date().toISOString(), from: o.total, to: rec.total}];
    if (await guard(() => save("orders", rec), "Prices updated. New total " + money(rec.total))) { const ix = S.d.orders.findIndex(x => x.id === o.id); if (ix >= 0) S.d.orders[ix] = rec; S.form = null; back(); }
  },
  dlTags: el => { const o = find("orders", el.dataset.id); const st = find("stores", o.storeId) || store(); if (o.tagsChanged) { const r = {...clone(o), tagsChanged: false}; save("orders", r).then(() => { putOrder(r); }).catch(() => {}); } download("tags-" + o.no.replace(/[^\w-]/g, "") + ".html", tagsDoc(o, st)); },
  dlSlip: el => { const o = find("orders", el.dataset.id); const st = find("stores", o.storeId) || store(); download("order-" + o.no.replace(/[^\w-]/g, "") + ".html", slipDoc(o, st)); },
  copyMsg: el => { const o = find("orders", el.dataset.id); const m = waMessage(o); navigator.clipboard.writeText(m).then(() => toast("Message copied"), () => toast("Couldn't copy. Long-press the order to copy manually.")); }
};

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const a = el.dataset.act; if (!ACT[a]) return;
  if (el.tagName === "INPUT" && (el.type === "checkbox" || el.type === "radio")) { ACT[a](el, e); return; }
  e.preventDefault(); ACT[a](el, e);
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.f && S.form) { const v = el.type === "checkbox" ? el.checked : el.value; setPath(S.form, el.dataset.f, v); }
  if (el.dataset.nc && S.draft && S.draft.newCust) S.draft.newCust[el.dataset.nc] = el.value;
});
document.addEventListener("input", e => {
  const el = e.target; if (!el.dataset.geo || !S.form) return;
  const f = S.form; f.geoText = el.value; const ll = parseLatLng(el.value);
  if (ll) { f.lat = ll.lat; f.lng = ll.lng; const st = store(); if (!f.storeForm && st && st.lat) { f.distanceKm = roadKm(st, ll); const di = document.querySelector('[data-f="distanceKm"]'); if (di) di.value = f.distanceKm; } }
  else { delete f.lat; delete f.lng; }
  const gi = document.getElementById("geoinfo"); if (gi) gi.innerHTML = geoInfo(f); const gl = document.getElementById("geolink"); if (gl) gl.href = mapsUrl(f);
});
document.addEventListener("toggle", e => { const d = e.target; if (d.dataset && d.dataset.gopen) S.ui.gOpen = d.open ? d.dataset.gopen : null; }, true);
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.dm && S.form) { const d = document.querySelector('[data-dm="' + el.dataset.dm + '"][data-part="d"]').value, m = document.querySelector('[data-dm="' + el.dataset.dm + '"][data-part="m"]').value; setPath(S.form, el.dataset.dm, d && m ? m + "-" + d : (d || m ? "partial" : "")); }
  if (["apartment","road","flat","area","city","address"].includes(el.dataset.f || "") && S.form && !S.form.lat) { const gl = document.getElementById("geolink"); if (gl) gl.href = mapsUrl(S.form); }
  if (el.id === "storepick") { S.storeId = el.value; lsSet("ll_store", el.value); render(); }
  if (el.dataset.f && S.form && el.tagName === "SELECT") setPath(S.form, el.dataset.f, el.value);
});

/* ---------- boot ---------- */
S.loaded = new Set();
async function syncAccess(rec, old){ /* independent app: who may sign in */
  if (!S.fire) return; const oe = String((old || {}).email || "").trim().toLowerCase(), ne = String(rec.email || "").trim().toLowerCase();
  if (oe && oe !== ne) await S.db.doc("access/" + oe).delete();
  if (ne) { if (rec.active === false) await S.db.doc("access/" + ne).delete(); else await S.db.doc("access/" + ne).set({role: rec.role || "Store staff", stores: rec.stores || [], name: rec.name || "", mobile: rec.mobile || "", empId: rec.id || ""}); }
}
function initGsi(){ /* Google Identity Services button – works on any website address */
  const el = document.getElementById("gsiBtn"); if (!el || !window.GOOGLE_CLIENT_ID) return;
  if (!(window.google && google.accounts && google.accounts.id)) { S.gsiTry = (S.gsiTry || 0) + 1; if (S.gsiTry < 40) setTimeout(initGsi, 250); else el.innerHTML = '<p class="hint">Google sign-in could not load. Check the internet connection.</p>'; return; }
  if (!S.gsiInit) { S.gsiInit = true; google.accounts.id.initialize({client_id: window.GOOGLE_CLIENT_ID, auto_select: false, cancel_on_tap_outside: true, callback: async r => {
    try { S.fireErr = ""; await firebase.auth().signInWithCredential(firebase.auth.GoogleAuthProvider.credential(r.credential)); } catch(e){ S.fireErr = "Sign-in failed: " + ((e && (e.code || e.message)) || ""); render(); } }}); }
  el.innerHTML = ""; google.accounts.id.renderButton(el, {theme: "filled_blue", size: "large", text: "signin_with", shape: "pill", width: 280});
}
function fireGateHtml(){
  const b = S.biz || {}; const u = S.fireUser;
  const head = '<div style="text-align:center;padding:48px 20px 16px"><div style="width:72px;height:72px;margin:0 auto 14px;border-radius:18px;background:var(--navy);display:flex;align-items:center;justify-content:center;color:#fff">' + ic("shirt") + '</div><h1 style="color:var(--navy);font-size:22px;margin:0">' + esc(window.APP_NAME || "Laundry Store Manager") + '</h1></div>';
  if (S.fireGate === "loading") return head + '<div class="loading"><div><div class="spin"></div>Opening…</div></div>';
  if (S.fireGate === "signin") return head + '<main><div class="card pad stack" style="align-items:center"><p style="margin:0">Sign in with the Gmail ID given to the store admin.</p><div id="gsiBtn" style="min-height:44px"></div>' + (window.GOOGLE_CLIENT_ID ? '<button class="link" data-act="fireSignIn">Trouble signing in? Try the other method</button>' : '<button class="btn" data-act="fireSignIn">Sign in with Google</button>') + '<p class="hint" id="fireerr" style="color:var(--danger)">' + esc(S.fireErr || "") + '</p></div></main>';
  return head + '<main><div class="card pad stack"><div class="notice">' + ic("warn") + '<div><b>' + esc((u || {}).email || "") + '</b> is not approved yet.<br>Ask the admin to add this Gmail in Masters → Employee / user.</div></div><button class="btn ghost" data-act="fireSignOut">Sign in with another Gmail</button></div></main>';
}
function startListeners(db){
  const onErr = e => { console.error(e); if (e && e.code === "revoked") { S.mode = "local"; } toast("Connection problem. Reopen the app if data stops updating."); };
  db.doc("config/business").onSnapshot(s => { S.biz = s.exists ? {...s.data()} : null; S.loaded.add("biz"); refresh(); }, onErr);
  COLS.forEach(c => { let q = db.collection(c); if (c === "orders") q = q.orderBy("createdAt", "desc").limit(500);
    q.onSnapshot(s => { S.d[c] = s.docs.map(d => ({id: d.id, ...d.data()})); S.loaded.add(c); refresh(); }, onErr); });
}
async function bootFire(){
  S.fire = true; S.fireGate = "loading"; render();
  firebase.initializeApp(window.FIREBASE_CONFIG); const fs = firebase.firestore();
  try { fs.settings({ignoreUndefinedProperties: true, merge: true}); } catch(e){}
  try { await fs.enablePersistence({synchronizeTabs: true}); } catch(e){}
  const auth = firebase.auth();
  try { await auth.getRedirectResult(); } catch(e){ S.fireErr = e.message; }
  auth.onAuthStateChanged(async u => {
    S.fireUser = u; if (!u) { S.fireGate = "signin"; render(); return; }
    const em = String(u.email || "").toLowerCase(); const owner = em === String(window.OWNER_EMAIL || "").toLowerCase();
    if (!owner) { try { const a = await fs.doc("access/" + em).get(); if (!a.exists) { S.fireGate = "denied"; render(); return; } S.fireAccess = a.data(); } catch(e){ S.fireGate = "denied"; render(); return; } }
    if (S.fireLast !== em) { S.view = "home"; S.stack = []; S.draft = null; S.form = null; S.fireLast = em; }
    S.isOwner = owner; S.empId = owner ? "owner" : null; S.userReady = true; S.db = fs; S.mode = "live"; S.fireGate = null;
    if (!S.listening) { S.listening = true; startListeners(fs); } render();
  });
}
async function boot(){
  if (window.FIREBASE_CONFIG && window.firebase) return bootFire();
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch(e){ db = null; }
  if (!db) { S.mode = "local"; S.biz = null; S.isOwner = true; S.userReady = true; render(); return; }
  (async () => { try { const u = window.claude && window.claude.use ? await window.claude.use("user") : null; S.isOwner = u ? !!(await u.isOwner()) : false; } catch(e){ S.isOwner = false; } S.userReady = true; refresh(); })();
  S.db = db; S.mode = "live"; startListeners(db);
}
boot();
