<style>
:root{--navy:#0B2A5B;--navy2:#14407F;--teal:#0F8F8A;--teal-soft:#E3F4F3;--soft:#EEF3FB;--line:#DCE3EE;--muted:#5B6B82;--ok:#1E7B45;--ok-soft:#E5F4EB;--bad:#B3261E;--bad-soft:#FBE9E7;--warn:#9A5B00;--warn-soft:#FFF4E0;--bg:#F5F7FB;--card:#fff;--ink:#13213A}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:540px;margin:0 auto;padding:0 16px 32px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 12px;border-bottom:1px solid var(--line);margin-bottom:16px}
.top img{max-height:54px;max-width:62%;display:block}.top .nm{font-weight:800;color:var(--navy);font-size:20px}
.callbtn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;background:var(--teal);color:#fff;font-weight:700;font-size:14px;text-decoration:none;white-space:nowrap}
h2{font-size:20px;color:var(--navy);margin:4px 0 6px;line-height:1.25}.lead{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(11,42,91,.05)}
.acts{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:14px}
.act{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;text-align:left;cursor:pointer;text-decoration:none;box-shadow:0 1px 2px rgba(11,42,91,.05)}
.act:active{transform:scale(.99)}.act b{display:block;font-size:17px;color:var(--navy)}.act small{display:block;color:var(--muted);font-size:14px;line-height:1.35}
.act .ico{flex:none;width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--navy)}.act.pri{background:var(--navy);border-color:var(--navy)}.act.pri b,.act.pri small{color:#fff}.act.pri .ico{background:rgba(255,255,255,.14);color:#fff}
.act .chev{margin-left:auto;color:var(--muted);font-size:20px}.act.pri .chev{color:#fff}
svg.i{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:12px;border:0;background:var(--navy);color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;text-align:center}
.btn.teal{background:var(--teal)}.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}.btn.wa{background:#1FA855}.btn:disabled{opacity:.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:14px;font-weight:600;color:var(--muted);margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:inherit}textarea{min-height:70px}
input.code{letter-spacing:.2em;text-transform:uppercase;font-family:ui-monospace,Menlo,Consolas,monospace}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;font-size:15px;cursor:pointer;color:inherit}
.chip[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}.chip.busy{border-color:#E8B04B}.chip.busy[aria-pressed=true]{background:#9A5B00;border-color:#9A5B00}
.hint{color:var(--muted);font-size:14px}.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.msg{padding:12px 14px;border-radius:12px;margin:12px 0;font-size:15px}.msg.bad{background:var(--bad-soft);color:var(--bad)}.msg.ok{background:var(--ok-soft);color:var(--ok)}.msg.warn{background:var(--warn-soft);color:var(--warn)}
.bill .no{font:800 22px/1.2 ui-monospace,Menlo,Consolas,monospace;color:var(--navy)}.status{font-weight:800;color:var(--navy);font-size:18px;margin:8px 0 4px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 4px}.steps div{font-size:12px;color:var(--muted);text-align:center;padding-top:8px;border-top:5px solid var(--line);border-radius:3px}.steps div.on{border-top-color:var(--ok);color:var(--ink);font-weight:700}
.sum{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}.sum:last-child{border-bottom:0}.sum.big{font-size:18px;font-weight:800;color:var(--navy)}

async function sha(t){ /* compact SHA-256, same result on every device */
  const K = [], H = []; let n = 2, c = 0; const isP = x => { for (let i = 2; i * i <= x; i++) if (x % i === 0) return false; return true; };
  while (c < 64) { if (isP(n)) { if (c < 8) H[c] = (Math.pow(n, 1 / 2) * 2 ** 32) | 0; K[c++] = (Math.pow(n, 1 / 3) * 2 ** 32) | 0; } n++; }
  const bytes = [...new TextEncoder().encode(t)]; const l = bytes.length * 8; bytes.push(0x80); while (bytes.length % 64 !== 56) bytes.push(0);
  for (let i = 7; i >= 0; i--) bytes.push(i >= 4 ? 0 : (l >>> (i * 8)) & 255);
  const r = (x, k) => (x >>> k) | (x << (32 - k)); const h = H.slice();
  for (let j = 0; j < bytes.length; j += 64) {
    const w = []; for (let i = 0; i < 16; i++) w[i] = (bytes[j + i * 4] << 24) | (bytes[j + i * 4 + 1] << 16) | (bytes[j + i * 4 + 2] << 8) | bytes[j + i * 4 + 3];
    for (let i = 16; i < 64; i++) { const s0 = r(w[i - 15], 7) ^ r(w[i - 15], 18) ^ (w[i - 15] >>> 3), s1 = r(w[i - 2], 17) ^ r(w[i - 2], 19) ^ (w[i - 2] >>> 10); w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0; }
    let [a, b, cc, d, e, f, g, hh] = h;
    for (let i = 0; i < 64; i++) { const t1 = (hh + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0, t2 = ((r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & b) ^ (a & cc) ^ (b & cc))) | 0; hh = g; g = f; f = e; e = (d + t1) | 0; d = cc; cc = b; b = a; a = (t1 + t2) | 0; }
    [a, b, cc, d, e, f, g, hh].forEach((v, i) => h[i] = (h[i] + v) | 0);
  }
  return h.map(v => (v >>> 0).toString(16).padStart(8, "0")).join("");
}

function loadOf(sid, d, slot){ return (((LOAD && LOAD.s || {})[sid] || {})[d] || {})[slot] || 0; }

VIEWS.book = function(){ var s = curStore(); var who = B ? {name: B.cname, cid: B.cid, ck: B.ck} : K; if (!who || !who.ck) return VIEWS.login();
  var days = []; for (var i = 0; i < 7; i++) days.push(addDays(i)); if (!F.date || days.indexOf(F.date) < 0) F.date = days[0];
  var sl = ((s.slots || {})[DAYS[new Date(F.date + "T00:00:00").getDay()]] || []).slice().sort().filter(function(x){ return slotOk(F.date, x); });

    (F.slot && busy(F.slot) ? '<div class="msg warn"><b>⏳ This time slot is busy.</b><br>Many customers have chosen the same time. Your pickup may be slightly delayed. Please bear with us – rest assured, our rider will reach you.' + (free.length ? '<br><span style="font-size:14px">Less busy times: ' + free.map(function(x){ return '<button class="link" data-a="ps" data-v="' + x + '">' + esc(slotLabel(x)) + '</button>'; }).join(", ") + '</span>' : "") + '</div>' : "") +
    ((P && P.svcs || []).length ? '<label>Services (optional)</label><div class="chips">' + P.svcs.map(function(x){ return '<button class="chip" data-a="sv" data-v="' + esc(x) + '" aria-pressed="' + (F.svcs.indexOf(x) >= 0) + '">' + esc(x) + '</button>'; }).join("") + '</div>' : "") +

VIEWS.booked = function(){ return '<div class="card" style="text-align:center"><div style="font-size:42px">✅</div><h2>Pickup request sent</h2><p>' + esc(fmtDate(F.bDate)) + ', ' + esc(slotLabel(F.bSlot || "")) + '</p><p class="hint">We will confirm on WhatsApp shortly.' + (F.bBusy ? " This time slot is busy – the pickup may be slightly delayed. Thank you for your patience." : "") + '</p></div>' + actsHtml([{a: "home", ic: "star", t: "Back to start", s: B ? "Your bill and other options" : "Book, track or pay"}]); };
function rateArr(D){ if (!D || !D.svcs || !D.svcs.length || Array.isArray(D.svcs[0])) return D; return {name: D.name, svcs: D.svcs.map(function(x){ return [x.i, x.n, x.c]; }), groups: (D.groups || []).map(function(g){ return [g.g, (g.rows || []).map(function(r){ return [r.n, r.u, r.r || []]; })]; })}; }
VIEWS.rates = function(){ var s = curStore(); var pl = (B && B.pl) || (K && K.pl) || (RATES && RATES.def && RATES.def[s.id]) || ""; var D = rateArr(RATES && RATES.pls && (RATES.pls[pl] || RATES.pls[Object.keys(RATES.pls)[0]]));

  var cols = D.svcs.map(function(x, i){ return [x, i]; }).filter(function(c){ return !RC.sv || c[0][0] === RC.sv; });

    '<div class="card" style="padding:8px 10px"><div class="tbl"><table><tr><th>Item</th>' + cols.map(function(c){ return '<th class="r">' + esc(c[0][1]) + '</th>'; }).join("") + '</tr>' + D.groups.map(function(g){ var rs = g[1].filter(function(r){ return cols.some(function(c){ return r[2][c[1]] > 0; }); }); return rs.length ? '<tr class="grp"><td colspan="' + (cols.length + 1) + '">' + esc(g[0]) + '</td></tr>' + rs.map(function(r){ return '<tr><td>' + esc(r[0]) + (r[1] ? ' <span class="hint">/ kg</span>' : "") + '</td>' + cols.map(function(c){ var v = r[2][c[1]]; return '<td class="r">' + (v > 0 ? money(v) : "–") + '</td>'; }).join("") + '</tr>'; }).join("") : ""; }).join("") + '</table></div></div>' +
    (B || K ? "" : '<p class="hint">New customer? <button class="link" data-a="newv">Book your first pickup</button></p>'); };
function render(){ header(); app.innerHTML = (VIEWS[V] || VIEWS.home)(); }
function val(id){ var e = document.getElementById(id); return e ? e.value : ""; }
async function findGo(){ var o = document.getElementById("fo"); var no = val("fb").toUpperCase().replace(/\s+/g, ""), m = val("fm").replace(/\D/g, "").slice(-10), pin = val("fp").toUpperCase().replace(/[^A-Z0-9]/g, ""); F.fb = no; F.fm = m;

async function loginGo(){ var o = document.getElementById("lo"); var m = val("lm").replace(/\D/g, "").slice(-10), pin = val("lp").toUpperCase().replace(/[^A-Z0-9]/g, ""); F.lm = m;

async function bookGo(){ var o = document.getElementById("bo"); var who = B ? {cid: B.cid, ck: B.ck} : K; var s = curStore(); F.instr = val("bi");
  if (!F.slot) { o.innerHTML = '<div class="msg bad">Choose the pickup time.</div>'; return; } if (!slotOk(F.date, F.slot)) { F.slot = ""; render(); return; }

async function cbSend(){ var o = document.getElementById("cbo"); var n = val("cbn").trim(), m = val("cbm").replace(/\D/g, "").slice(-10);

document.addEventListener("click", function(e){ var el = e.target.closest("[data-a]"); if (!el) return; var a = el.dataset.a; var v = el.dataset.v;
  if (a === "back") return back(); if (a === "home") { HIST = []; V = B ? "bill" : "home"; render(); window.scrollTo(0, 0); return; }

(async function(){ if (!db) { app.innerHTML = '<div class="msg bad">This page could not start. Please call the store.</div>'; return; }

  if (TK.length >= 6) { try { var tid = await sha("llt|" + TK); var t = await db.collection("tok").doc(tid).get(); if (t.exists) { B = Object.assign({_id: tid}, t.data()); F.sid = B.hs || B.sid; } else app.innerHTML = ""; } catch(e){} if (!B) { V = "find"; HIST = ["home"]; render(); var o = document.getElementById("fo"); if (o) o.innerHTML = '<div class="msg bad">This bill link is not valid any more. Enter your bill details, or contact the store.</div>'; return; } }
