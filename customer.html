<style>
:root{--navy:#0B2A5B;--blue:#1F5FBF;--soft:#EEF3FB;--line:#D9E1EE;--muted:#5B6B82;--ok:#1E7B45;--ok-soft:#E5F4EB;--bad:#B3261E;--bad-soft:#FBE9E7;--bg:#F6F8FC}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:#13213A;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px 16px 40px}
.brand{text-align:center;margin:6px 0 14px}.brand img{max-width:240px;max-height:80px}.brand h1{margin:6px 0 0;font-size:22px;color:var(--navy)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.big{display:flex;align-items:center;gap:14px;width:100%;padding:18px;border-radius:14px;border:0;background:var(--navy);color:#fff;font-size:19px;font-weight:700;cursor:pointer;margin-bottom:12px;text-align:left}
.big.alt{background:#fff;color:var(--navy);border:2px solid var(--navy)}.big small{display:block;font-weight:400;font-size:14px;opacity:.85}
label{display:block;font-size:14px;font-weight:600;color:var(--muted);margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:inherit}
textarea{min-height:70px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;font-size:15px;cursor:pointer;color:inherit}
.chip[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn{width:100%;padding:15px;border:0;border-radius:12px;background:var(--ok);color:#fff;font:inherit;font-size:18px;font-weight:700;cursor:pointer;margin-top:16px}
.btn:disabled{opacity:.6}.link{background:none;border:0;color:var(--blue);font:inherit;cursor:pointer;padding:8px 0;text-decoration:underline}
.msg{padding:12px;border-radius:10px;margin-top:12px}.msg.ok{background:var(--ok-soft);color:var(--ok)}.msg.bad{background:var(--bad-soft);color:var(--bad)}
.hint{color:var(--muted);font-size:14px}.req{color:var(--bad)}
.steps{display:flex;gap:4px;margin:14px 0}.steps div{flex:1;text-align:center;font-size:12px;color:var(--muted)}.steps div:before{content:"";display:block;height:8px;border-radius:4px;background:var(--line);margin-bottom:6px}
.steps div.on{color:var(--navy);font-weight:700}.steps div.on:before{background:var(--ok)}
.status{font-size:22px;font-weight:800;color:var(--navy)}
table{width:100%;border-collapse:collapse}td{padding:6px 0;border-bottom:1px solid var(--line)}td:last-child{text-align:right;font-weight:600}

<script>
async function sha(t){ /* compact SHA-256, same result on every device */
  const K = [], H = []; let n = 2, c = 0; const isP = x => { for (let i = 2; i * i <= x; i++) if (x % i === 0) return false; return true; };
  while (c < 64) { if (isP(n)) { if (c < 8) H[c] = (Math.pow(n, 1 / 2) * 2 ** 32) | 0; K[c++] = (Math.pow(n, 1 / 3) * 2 ** 32) | 0; } n++; }
  const bytes = [...new TextEncoder().encode(t)]; const l = bytes.length * 8; bytes.push(0x80); while (bytes.length % 64 !== 56) bytes.push(0);
  for (let i = 7; i >= 0; i--) bytes.push(i >= 4 ? 0 : (l >>> (i * 8)) & 255);
  const r = (x, k) => (x >>> k) | (x << (32 - k)); const h = H.slice();
  for (let j = 0; j < bytes.length; j += 64) {
    const w = []; for (let i = 0; i < 16; i++) w[i] = (bytes[j + i * 4] << 24) | (bytes[j + i * 4 + 1] << 16) | (bytes[j + i * 4 + 2] << 8) | bytes[j + i * 4 + 3];
    for (let i = 16; i < 64; i++) { const s0 = r(w[i - 15], 7) ^ r(w[i - 15], 18) ^ (w[i - 15] >>> 3), s1 = r(w[i - 2], 17) ^ r(w[i - 2], 19) ^ (w[i - 2] >>> 10); w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0; }
    let [a, b, cc, d, e, f, g, hh] = h;
    for (let i = 0; i < 64; i++) { const t1 = (hh + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0, t2 = ((r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & b) ^ (a & cc) ^ (b & cc))) | 0; hh = g; g = f; f = e; e = (d + t1) | 0; d = cc; cc = b; b = a; a = (t1 + t2) | 0; }
    [a, b, cc, d, e, f, g, hh].forEach((v, i) => h[i] = (h[i] + v) | 0);
  }
  return h.map(v => (v >>> 0).toString(16).padStart(8, "0")).join("");
}

var P = null, V = "home", st = null, F = {date: "", slot: "", svcs: []};
var pad = function(n){ return String(n).padStart(2, "0"); };
var ymd = function(d){ return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
var addDays = function(n){ var d = new Date(); d.setDate(d.getDate() + n); return ymd(d); };
var DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var fmtDate = function(s){ if (!s) return ""; return new Date(s + "T00:00:00").toLocaleDateString("en-IN", {weekday: "short", day: "numeric", month: "short"}); };
var slotLabel = function(s){ return String(s).replace("-", " – "); };
var esc = function(t){ return String(t == null ? "" : t).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); };
var money = function(n){ return "₹" + (Math.round((+n || 0) * 100) / 100).toLocaleString("en-IN"); };
var slotOk = function(date, slot){ var t = ymd(new Date()); if (date < t) return false; if (date > t) return true; var p = String(slot).slice(0, 5).split(":").map(Number); var n = new Date(); return p[0] * 60 + (p[1] || 0) >= n.getHours() * 60 + n.getMinutes() + 5; };
var slotsFor = function(date){ return ((st && st.slots || {})[DAYS[new Date(date + "T00:00:00").getDay()]] || []).slice().sort().filter(function(x){ return slotOk(date, x); }); };
var q = new URLSearchParams(location.search); var preBill = q.get("b") || "";
var app = document.getElementById("app");
var db = null;
try { firebase.initializeApp(window.FIREBASE_CONFIG); db = firebase.firestore(); } catch(e){}

function brand(){ var b = document.getElementById("brand"); b.innerHTML = (window.APP_LOGO ? '<img src="' + window.APP_LOGO + '" alt="">' : "") + '<h1>' + esc((P && P.name) || window.APP_NAME || "") + '</h1>'; }
function storePick(){ if (!P || P.stores.length < 2) return ""; return '<label>Your nearest store <span class="req">*</span></label><select id="stp">' + P.stores.map(function(s){ return '<option value="' + s.id + '"' + (st && st.id === s.id ? " selected" : "") + '>' + esc(s.name) + '</option>'; }).join("") + '</select>'; }
function render(){
  brand();
  if (V === "home") {
    app.innerHTML = '<button class="big" data-go="book"><span style="font-size:28px">🧺</span><span>Book a pickup<small>Our rider will collect clothes from your home</small></span></button>' +
      '<button class="big alt" data-go="track"><span style="font-size:28px">🔍</span><span>Track my order<small>Know the status of your bill</small></span></button>' +
      (st && st.phone ? '<div class="card" style="text-align:center"><div class="hint">Need help? Call the store</div><a href="tel:+91' + esc(st.phone) + '" style="font-size:20px;font-weight:700;color:var(--navy)">' + esc(st.phone) + '</a></div>' : "");
    return;
  }
  if (V === "book") {
    if (!st) { app.innerHTML = '<div class="card"><p>Online booking is not available right now. Please call the store.</p></div><button class="link" data-go="home">← Back</button>'; return; }
    var days = []; for (var i = 0; i < 7; i++) days.push(addDays(i));
    if (!F.date) F.date = days.find(function(d){ return slotsFor(d).length; }) || days[0];
    var sl = slotsFor(F.date); if (sl.indexOf(F.slot) < 0) F.slot = "";
    var svcs = (P && P.svcs) || [];
    if (!F.checked) {
      app.innerHTML = '<button class="link" data-go="home">← Back</button><div class="card"><h2 style="margin:0 0 4px;color:var(--navy)">Book a pickup</h2><p class="hint" style="margin:0">Start with your mobile number.</p>' + storePick() +
        '<label>Mobile number (10 digits) <span class="req">*</span></label><input id="mb" inputmode="numeric" maxlength="10" autocomplete="tel-national" value="' + esc(F.mobile || "") + '">' +
        '<button class="btn" id="mcont" style="background:var(--navy)">Continue</button><div id="out"></div></div>';
      return;
    }
    var addrF = '<label>Flat / house no. <span class="req">*</span></label><input id="fl" maxlength="60" value="' + esc(F.flat || "") + '">' +
      '<label>Apartment / street</label><input id="ap" maxlength="80" value="' + esc(F.apartment || "") + '">' +
      '<label>Area / colony <span class="req">*</span></label><input id="ar" maxlength="80" value="' + esc(F.area || "") + '">';
    app.innerHTML = '<button class="link" data-go="home">← Back</button><div class="card"><h2 style="margin:0 0 4px;color:var(--navy)">Book a pickup</h2>' +
      '<p style="margin:6px 0 0">Mobile: <b>' + esc(F.mobile) + '</b> <button class="link" id="mchg" style="padding:0 0 0 6px">Change</button></p>' +
      (F.known ? '<div class="msg ok" style="font-size:17px">Welcome back, <b>' + esc(F.kname || "") + '</b>!</div>' +
          (F.chAddr ? '<p class="hint" style="margin:12px 0 0">Enter the new pickup address:</p>' + addrF + '<button class="link" id="keepaddr">Use my saved address</button>'
            : '<label>Pickup address</label><div class="msg" style="background:var(--soft);color:var(--navy);margin-top:0">' + (F.kaddr ? esc(F.kaddr) + '<div class="hint">Saved address (partly hidden for your privacy)</div>' : 'We will use your saved address.') + '</div><button class="link" id="chaddr">Change address</button>')
        : '<p class="hint" style="margin:8px 0 0">New customer – please fill your details. The store will call you to confirm.</p>' +
          '<label>Your name <span class="req">*</span></label><input id="nm" maxlength="60" autocomplete="name" value="' + esc(F.name || "") + '">' + addrF) +
      '<label>Pickup day <span class="req">*</span></label><div class="chips">' + days.map(function(d){ return '<button class="chip" data-date="' + d + '" aria-pressed="' + (d === F.date) + '">' + (d === days[0] ? "Today" : d === days[1] ? "Tomorrow" : esc(fmtDate(d))) + '</button>'; }).join("") + '</div>' +
      '<label>Pickup time <span class="req">*</span></label>' + (sl.length ? '<div class="chips">' + sl.map(function(x){ return '<button class="chip" data-slot="' + x + '" aria-pressed="' + (x === F.slot) + '">' + esc(slotLabel(x)) + '</button>'; }).join("") + '</div>' : '<p class="hint">No pickup time left on this day. Please choose another day.</p>') +
      (svcs.length ? '<label>Services needed (optional)</label><div class="chips">' + svcs.map(function(x){ return '<button class="chip" data-svc="' + esc(x) + '" aria-pressed="' + (F.svcs.indexOf(x) >= 0) + '">' + esc(x) + '</button>'; }).join("") + '</div>' : "") +
      '<label>Any instructions (optional)</label><textarea id="in" maxlength="300">' + esc(F.instr || "") + '</textarea>' +
      '<button class="btn" id="send">Send pickup request</button><div id="out"></div></div>';
    return;
  }
  if (V === "sent") {
    app.innerHTML = '<div class="card" style="text-align:center"><div style="font-size:44px">✅</div><h2 style="color:var(--ok);margin:6px 0">Request received</h2><p>Thank you, ' + esc(F.name) + '.<br>Pickup asked for <b>' + esc(fmtDate(F.date)) + ', ' + esc(slotLabel(F.slot)) + '</b>.</p><p class="hint">' + (F.known ? 'The store will send a confirmation on WhatsApp to ' + esc(F.mobile) + '.' : 'The store will call you on ' + esc(F.mobile) + ' to confirm.') + '</p></div><button class="big alt" data-go="home">Done</button>';
    return;
  }
  if (V === "track" && !F.byBill) {
    app.innerHTML = '<button class="link" data-go="home">← Back</button><div class="card"><h2 style="margin:0 0 4px;color:var(--navy)">Track my order</h2><p class="hint" style="margin:0">Enter your mobile number to see your bills with us.</p>' +
      '<label>Mobile number (10 digits) <span class="req">*</span></label><input id="tm" inputmode="numeric" maxlength="10" value="' + esc(F.mobile || "") + '">' +
      '<button class="btn" id="findm" style="background:var(--navy)">Show my bills</button><div id="tout"></div>' +
      '<button class="link" id="bybill">Search by bill number (shows amount and balance)</button></div>';
    return;
  }
  if (V === "track") {
    app.innerHTML = '<button class="link" data-go="home">← Back</button><div class="card"><h2 style="margin:0 0 4px;color:var(--navy)">Track my order</h2><p class="hint" style="margin:0">Bill number is printed on your bill and in our WhatsApp message.</p>' +
      '<label>Bill number <span class="req">*</span></label><input id="bn" autocapitalize="characters" value="' + esc(F.bill || preBill) + '">' +
      '<label>Mobile number (10 digits) <span class="req">*</span></label><input id="tm" inputmode="numeric" maxlength="10" value="' + esc(F.mobile || "") + '">' +
      '<button class="btn" id="find" style="background:var(--navy)">Show status</button><div id="tout"></div><button class="link" id="bymob">Show all my bills by mobile number</button></div>';
  }
}
var STEPS = ["Received", "In process", "Ready", "Delivered"];
function stepOf(stage){ if (/^Delivered/.test(stage)) return 3; if (/With rider|Ready|Partly/.test(stage)) return 2; if (/Pickup booked|Count pending/.test(stage)) return 0; return 1; }
function friendly(stage){ if (stage === "Pickup booked") return "Pickup booked"; if (stage === "Count pending") return "Received – being checked"; if (stage === "Ready at shop") return "Ready – you can collect from the shop"; if (stage === "With rider") return "Out for delivery"; if (stage === "Partly delivered") return "Partly delivered"; if (stage === "Delivered" || stage === "Cancelled") return stage; return "In process"; }
var ML = null;
function billCard(b, i){ var k = stepOf(b.stage); void i; return '<div class="card" style="margin:10px 0 0;background:var(--soft);border:0">' +
  '<div style="display:flex;justify-content:space-between;gap:8px"><span class="hint">Bill ' + esc(b.no) + ' · ' + esc(fmtDate(b.date)) + '</span><span class="hint">' + (+b.pieces || 0) + ' pcs</span></div><div style="font-weight:800;color:var(--navy);font-size:18px">' + esc(friendly(b.stage)) + '</div>' +
  (b.stage === "Cancelled" ? "" : '<div class="steps" style="margin:8px 0 4px">' + STEPS.map(function(x, j){ return '<div class="' + (j <= k ? "on" : "") + '">' + x + '</div>'; }).join("") + '</div>') +
  (b.deliveryDate && !/^Delivered/.test(b.stage) ? '<div class="hint">Expected delivery: <b>' + esc(fmtDate(b.deliveryDate)) + (b.deliverySlot ? ', ' + esc(slotLabel(b.deliverySlot)) : "") + '</b></div>' : "") + '</div>'; }
async function findMobile(){
  var out = document.getElementById("tout"); var m = document.getElementById("tm").value.replace(/\D/g, "").slice(-10); F.mobile = m;
  if (m.length !== 10) { out.innerHTML = '<div class="msg bad">Enter your 10-digit mobile number.</div>'; return; }
  out.innerHTML = '<p class="hint">Checking…</p>';
  try { var s = await db.collection("trackm").doc(await sha("llm|" + m)).get(); ML = s.exists ? s.data() : null;
    if (!ML || (!(ML.open || []).length && !(ML.done || []).length)) { out.innerHTML = '<div class="msg bad">No bills found for this mobile number. Please check the number, or call the store.</div>'; return; }
    var all = (ML.open || []).concat(ML.done || []);
    out.innerHTML = '<p style="margin:14px 0 0">Hello <b>' + esc(ML.name || "") + '</b>, ' + ((ML.open || []).length ? 'you have <b>' + ML.open.length + '</b> bill(s) with us.' : 'you have no pending bills.') + '</p>' +
      (ML.open || []).map(function(b, i){ return billCard(b, i); }).join("") +
      ((ML.done || []).length ? '<p class="hint" style="margin:16px 0 0">Recently delivered</p>' + ML.done.map(function(b, i){ return billCard(b, (ML.open || []).length + i); }).join("") : "") +
      '<p class="hint" style="margin-top:12px">For amount and balance, use "Search by bill number" with the number printed on your bill.</p>' +
      (ML.phone ? '<p class="hint">Questions? Call <a href="tel:+91' + esc(ML.phone) + '">' + esc(ML.phone) + '</a></p>' : "");
    void all;
  } catch(e){ out.innerHTML = '<div class="msg bad">Could not check now. Please check your internet and try again.</div>'; }
}
async function findOrder(){
  var out = document.getElementById("tout"); var no = document.getElementById("bn").value.toUpperCase().replace(/\s+/g, ""); var m = document.getElementById("tm").value.replace(/\D/g, "").slice(-10);
  F.bill = no; F.mobile = m;
  if (!no || m.length !== 10) { out.innerHTML = '<div class="msg bad">Enter the bill number and your 10-digit mobile number.</div>'; return; }
  out.innerHTML = '<p class="hint">Checking…</p>';
  try { var id = await sha("ll|" + no + "|" + m); var s = await db.collection("track").doc(id).get();
    if (!s.exists) { out.innerHTML = '<div class="msg bad">No order found. Please check the bill number and mobile number, or call the store.</div>'; return; }
    var t = s.data(); var k = stepOf(t.stage);
    out.innerHTML = '<div class="card" style="margin:14px 0 0;background:var(--soft);border:0"><div class="hint">Bill ' + esc(t.no) + (t.store ? ' · ' + esc(t.store) : "") + '</div><div class="status">' + esc(friendly(t.stage)) + '</div>' +
      (t.stage === "Cancelled" ? "" : '<div class="steps">' + STEPS.map(function(x, i){ return '<div class="' + (i <= k ? "on" : "") + '">' + x + '</div>'; }).join("") + '</div>') +
      '<table><tr><td>Order date</td><td>' + esc(fmtDate(t.date)) + '</td></tr>' + (t.deliveryDate && !/^Delivered|Cancelled/.test(t.stage) ? '<tr><td>Expected delivery</td><td>' + esc(fmtDate(t.deliveryDate)) + (t.deliverySlot ? '<br>' + esc(slotLabel(t.deliverySlot)) : "") + '</td></tr>' : "") +
      '<tr><td>Pieces</td><td>' + (+t.pieces || 0) + '</td></tr><tr><td>Bill amount</td><td>' + money(t.total) + '</td></tr><tr><td>Paid</td><td>' + money(t.paid) + '</td></tr><tr><td>Balance</td><td style="color:' + (t.bal > 0 ? "var(--bad)" : "var(--ok)") + '">' + money(t.bal) + '</td></tr></table>' +
      (t.phone ? '<p class="hint" style="margin-bottom:0">Questions? Call <a href="tel:+91' + esc(t.phone) + '">' + esc(t.phone) + '</a></p>' : "") + '</div>';
  } catch(e){ out.innerHTML = '<div class="msg bad">Could not check now. Please check your internet and try again.</div>'; }
}
function keep(){ var g = function(id, k){ var e = document.getElementById(id); if (e) F[k] = e.value; }; if (V !== "book") return;
  g("nm", "name"); g("mb", "mobile"); g("fl", "flat"); g("ap", "apartment"); g("ar", "area"); g("in", "instr"); }
async function checkMobile(){ keep(); var out = document.getElementById("out"); var m = String(F.mobile || "").replace(/\D/g, "").slice(-10);
  if (m.length !== 10) { out.innerHTML = '<div class="msg bad">Enter your 10-digit mobile number.</div>'; return; }
  var b = document.getElementById("mcont"); b.disabled = true; b.textContent = "Checking…";
  var K = null; try { var s = await db.collection("trackm").doc(await sha("llm|" + m)).get(); K = s.exists ? s.data() : null; } catch(e){ K = null; }
  F.mobile = m; F.known = !!(K && K.known); F.kname = K && K.name || ""; F.kaddr = K && K.addr || ""; F.chAddr = false; F.checked = true; render(); }
async function send(){
  keep(); var out = document.getElementById("out"); var m = String(F.mobile || "").replace(/\D/g, ""); var needAddr = !F.known || F.chAddr;
  if (F.known) F.name = F.kname || "Customer"; if (F.known && !F.chAddr) { F.flat = ""; F.apartment = ""; F.area = ""; }
  var bad = !String(F.name || "").trim() ? "Enter your name." : m.length !== 10 ? "Enter your 10-digit mobile number." : needAddr && !String(F.flat || "").trim() ? "Enter your flat / house number." : needAddr && !String(F.area || "").trim() ? "Enter your area / colony." : !F.slot ? "Choose the pickup time." : !slotOk(F.date, F.slot) ? "That time has passed. Choose another time." : "";
  if (bad) { out.innerHTML = '<div class="msg bad">' + bad + '</div>'; return; }
  var b = document.getElementById("send"); b.disabled = true; b.textContent = "Sending…";
  try { await db.collection("webreq").add({storeId: st.id, name: F.name.trim().slice(0, 60), mobile: m, flat: String(F.flat || "").trim().slice(0, 60), apartment: String(F.apartment || "").trim().slice(0, 80), area: String(F.area || "").trim().slice(0, 80), date: F.date, slot: F.slot, svcs: F.svcs.join(", ").slice(0, 200), instr: String(F.instr || "").trim().slice(0, 300), at: new Date().toISOString(), status: "New"});
    F.mobile = m; V = "sent"; render(); F.checked = false; F.slot = ""; F.instr = ""; F.svcs = []; window.scrollTo(0, 0);
  } catch(e){ b.disabled = false; b.textContent = "Send pickup request"; out.innerHTML = '<div class="msg bad">Could not send now. Please check your internet and try again, or call the store.</div>'; }
}
document.addEventListener("click", function(e){
  var el = e.target.closest("button,a"); if (!el) return;
  if (el.dataset.go) { keep(); V = el.dataset.go; render(); window.scrollTo(0, 0); return; }
  if (el.dataset.date) { keep(); F.date = el.dataset.date; F.slot = ""; render(); return; }
  if (el.dataset.slot) { keep(); F.slot = el.dataset.slot; render(); return; }
  if (el.dataset.svc) { keep(); var i = F.svcs.indexOf(el.dataset.svc); if (i >= 0) F.svcs.splice(i, 1); else F.svcs.push(el.dataset.svc); render(); return; }
  if (el.id === "send") return send();
  if (el.id === "mcont") return checkMobile();
  if (el.id === "mchg") { keep(); F.checked = false; render(); return; }
  if (el.id === "chaddr") { keep(); F.chAddr = true; render(); return; }
  if (el.id === "keepaddr") { keep(); F.chAddr = false; render(); return; }
  if (el.id === "find") return findOrder();
  if (el.id === "findm") return findMobile();
  if (el.id === "bybill") { var t = document.getElementById("tm"); if (t) F.mobile = t.value; F.byBill = true; render(); return; }
  if (el.id === "bymob") { var t2 = document.getElementById("tm"); if (t2) F.mobile = t2.value; F.byBill = false; render(); return; }
});
document.addEventListener("change", function(e){ if (e.target.id === "stp") { keep(); st = P.stores.find(function(s){ return s.id === e.target.value; }) || st; F.slot = ""; render(); } });
(async function(){
  try { var s = await db.doc("pub/stores").get(); P = s.exists ? s.data() : null; } catch(e){ P = null; }
  if (P && P.stores && P.stores.length) st = P.stores[0];
  if (preBill) { V = "track"; F.byBill = true; }
  render();
})();
</script></body></html>
